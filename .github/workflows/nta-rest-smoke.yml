name: NTA REST API smoke test
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "public, authenticated (capture OFF), or capture-on read-only verification"
        required: true
        default: public
        type: choice
        options:
          - public
          - authenticated
          - capture-on
      confirm_live_read:
        description: "For capture-on only: type yes to authorize reading one record in runner memory"
        required: false
        default: "no"
        type: string
  push:
    paths:
      - ".github/workflows/nta-rest-smoke.yml"
      - "tests/nta-rest-smoke.py"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      NTA_CONFIRM_LIVE_READ: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live_read || 'no' }}
      NTA_SMOKE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'public' }}
      NTA_WP_USERNAME: ${{ secrets.NTA_WP_USERNAME }}
      NTA_WP_APP_PASSWORD: ${{ secrets.NTA_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute read-only smoke checks
        run: python3 -B tests/nta-rest-smoke.py
