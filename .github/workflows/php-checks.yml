name: WordPress bridge checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          find ari-nta-bridge tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run schema tests
        run: |
          php tests/test-schema.php
          php tests/test-capture-gate.php
          php tests/test-capture-enabled.php
